[package]
name = "voicely-local"
version = "0.1.0"
default-run = "voicely-local"
description = "A private, local-first voice writing assistant"
authors = ["You"]
edition = "2021"

[lib]
name = "voicely_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "whisper-worker"
path = "src/bin/whisper-worker.rs"
required-features = ["whisper-worker"]

[[bin]]
name = "llm-worker"
path = "src/bin/llm-worker.rs"
required-features = ["llm-worker"]

[features]
default = []
whisper-worker = ["dep:whisper-rs"]
llm-worker = ["dep:llama-cpp-2", "dep:encoding_rs"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.1", features = [] }
tauri-plugin-clipboard-manager = "2.2.1"
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-opener = "2.2.5"
base64 = "0.22"
chrono = "0.4"
encoding_rs = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
whisper-rs = { version = "0.13", optional = true }
llama-cpp-2 = { version = "0.1.156", features = ["metal"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
