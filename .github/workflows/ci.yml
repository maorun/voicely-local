name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Fast macOS checks
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore verified Whisper Small model
        uses: actions/cache@v6.1.0
        with:
          path: src-tauri/resources/models/ggml-small.bin
          key: whisper-small-1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare Whisper Small model
        run: npm run prepare:models

      - name: Check frontend
        run: npm run build

      - name: Build packaged worker binaries
        run: npm run prepare:workers

      - name: Check native main application
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Check whitespace errors
        run: git diff --check
