name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and check macOS
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore verified Whisper Small model
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models/ggml-small.bin
          key: whisper-small-1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b-${{ runner.os }}-${{ runner.arch }}

      - name: Build complete desktop application
        run: npm run build:desktop

      - name: Check native main application
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Check isolated Whisper worker
        run: cargo check --manifest-path src-tauri/Cargo.toml --features whisper-worker --bin whisper-worker

      - name: Check isolated LLM worker
        run: cargo check --manifest-path src-tauri/Cargo.toml --features llm-worker --bin llm-worker

      - name: Check whitespace errors
        run: git diff --check
